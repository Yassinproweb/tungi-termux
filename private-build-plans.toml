[buildPlans.Yassinevka]
family = "Yassinevka"
spacing = "term"
serifs = "slab"
noCvSs = true
exportGlyphNames = true

  [buildPlans.Yassinevka.variants]
  inherits = "ss08"

    [buildPlans.Yassinevka.variants.design]
    one = "base-top-cut"
    two = "straight-neck-serifed"
    three = "flat-top-serifed"
    four = "open-non-crossing-serifed"
    five = "oblique-flat-serifed"
    six = "straight-bar"
    seven = "curly-serifed-crossbar"
    eight = "crossing-asymmetric"
    nine = "straight-bar"
    zero = "diamond-broken-slash"
    capital-a = "curly-top-serifed"
    capital-b = "standard-interrupted-unilateral-serifed"
    capital-c = "bilateral-inward-serifed"
    capital-d = "more-rounded-unilateral-serifed"
    capital-e = "top-left-serifed"
    capital-f = "top-left-serifed"
    capital-g = "toothless-corner-serifed-hookless"
    capital-h = "top-left-serifed"
    capital-i = "serifed"
    capital-j = "serifed-both-sides"
    capital-k = "symmetric-connected-top-left-serifed"
    capital-l = "motion-serifed"
    capital-m = "slanted-sides-hanging-motion-serifed"
    capital-n = "asymmetric-motion-serifed"
    capital-p = "open-motion-serifed"
    capital-q = "detached-bend-tailed"
    capital-r = "straight-open-top-left-serifed"
    capital-s = "unilateral-serifed"
    capital-t = "motion-serifed"
    capital-u = "toothless-rounded-unilateral-motion-serifed"
    capital-v = "curly-motion-serifed"
    capital-w = "curly-flat-top-motion-serifed"
    capital-x = "curly-unilateral-motion-serifed"
    capital-y = "curly-base-serifed"
    capital-z = "cursive-with-horizontal-crossbar"
    a = "single-storey-earless-corner-tailed"
    b = "toothless-rounded-serifed"
    c = "unilateral-inward-serifed"
    d = "toothless-rounded-serifed"
    e = "rounded"
    f = "flat-hook-diagonal-tailed-crossbar-at-x-height"
    g = "single-storey-serifed"
    h = "tailed-motion-serifed"
    i = "serifed-diagonal-tailed"
    j = "diagonal-tailed-serifed"
    k = "diagonal-tailed-cursive-top-left-serifed"
    l = "serifed-diagonal-tailed"
    m = "earless-single-arch-bottom-right-serifed"
    n = "earless-rounded-straight-motion-serifed"
    p = "eared-motion-serifed"
    q = "earless-rounded-straight-serifed"
    r = "corner-hooked-top-serifed"
    s = "unilateral-serifed"
    t = "diagonal-tailed"
    u = "toothless-rounded-motion-serifed"
    v = "cursive-serifed"
    w = "cursive-serifed"
    x = "semi-chancery-curly-serifed"
    y = "cursive-motion-serifed"
    z = "cursive-with-horizontal-crossbar"
    capital-eszet = "flat-top-serifed"
    eszet = "longs-s-lig-tailed-middle-serifed"
    asterisk = "turn-penta-high"
    caret = "high"
    paren = "flat-arc"
    brace = "curly-flat-boundary"
    guillemet = "curly"
    number-sign = "slanted-open"
    percent = "rings-continuous-slash-also-connected"
    question = "corner"
    decorative-angle-brackets = "tall"
    lig-ltgteq = "slanted"
    lig-neq = "vertical-dotted"

  [buildPlans.Yassinevka.ligations]
  inherits = "dlig"

[buildPlans.Yassinevka.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Yassinevka.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Yassinevka.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Yassinevka.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
